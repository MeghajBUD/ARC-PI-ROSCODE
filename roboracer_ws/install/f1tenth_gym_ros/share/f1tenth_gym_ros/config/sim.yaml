#
# Template version: map_path is just the map NAME (no path, no extension).
# The launch file resolves it to an absolute path under the package's installed
# maps/ folder, so this file needs no edits when cloned to another machine.
# To switch maps: drop <name>.png + <name>.yaml in maps/, set map_path: '<name>', rebuild.

bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.275

    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters  (NAME ONLY — launch resolves the full path)
    map_path: 'levine'
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 1

    # ego starting pose on map
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: True
